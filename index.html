<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide for NFSU DS-AI</title>
</head>


<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    max-width: 500px;
    margin: auto;
    padding: 10px;
  }
  .main {
    /* text-align: center; */
    /* margin: auto; */
  }
  h1 {
    margin-bottom: 60px;
  }
  .main-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .resource-button {
    background-color: bisque;
    padding: 20px;
    border: solid 2px black;
    font-size: 20px;
  }
  .left-align-list {
    text-align: justify;
  }
  .last-updated {
    margin-top: 40px;
    font-size: 12px;
    color: gray;
    text-align: center;
  }

</style>

<body>
  <div class="main">
    <h1>Guide for NFSU DS-AI Course</h1>
    <h2>Resources</h2>
    <div class="main-buttons">
      <a class="resource-button" href="https://github.com/dwaidatta/ds-ai-nfsu" target="_blank">GitHub Repo</a>
      <a class="resource-button" href="https://colab.research.google.com/drive/11vwktJTAfu2MWV13MNjNKua4OnMJH8Av?usp=sharing" target="_blank">Module 1</a>
    </div>
    <h2>Exercise</h2>
    <div class="main-buttons">
      <a class="resource-button" href="https://colab.research.google.com/drive/1jcuL_LbFLsnlaxBdGkXNkNhuUc4Ip5lU?usp=sharing" target="_blank">Practice Exercise Notebook</a>
    </div>
    <h2>Live Classes</h2>
    <ol class="left-align-list">
      <li>Date: 10/08/2026</li>
      <li>Date: 16/08/2026</li>
      <li>Date: 20/08/2026. Remedial class.</li>
      <li>Date: 21/08/2026. Remedial class.</li>
      <li>Date: 22/08/2026</li>
    </ol>
    <p id="last-updated" class="last-updated"></p>
  </div>

  <script>
    fetch('build-info.json?_=' + Date.now())
      .then((res) => res.json())
      .then((data) => {
        const el = document.getElementById('last-updated');
        if (!el) return;
        const date = new Date(data.date);
        el.textContent = `Last updated: v${data.version} · ${date.toLocaleDateString()}`;
      })
      .catch(() => {});
  </script>
</body>
</html>
